    <noscript
      ><p style="padding: 24px">Auralis needs JavaScript to run.</p></noscript
    >
    <div class="app" id="app">
      <aside class="sidebar glass" id="sidebar" aria-label="Sidebar"></aside>
      <main class="main glass" aria-label="Content">
        <div class="scroll" id="main" tabindex="-1">
          <header class="topbar" id="topbar"></header>
          <div id="view"></div>
        </div>
      </main>
      <aside
        class="right glass"
        id="right"
        aria-label="Now playing panel"
      ></aside>
      <footer class="player glass" id="player" aria-label="Player"></footer>
      <nav class="tabbar glass" id="tabbar" aria-label="Primary"></nav>
    </div>
    <section
      id="fs"
      role="dialog"
      aria-modal="true"
      aria-label="Full-screen player"
      aria-hidden="true"
    ></section>
    <aside id="mini" class="glass" aria-label="Floating mini player"></aside>
    <div id="toasts" aria-live="polite"></div>
    <div id="seektip" aria-hidden="true"></div>
    <div id="cur-dot" aria-hidden="true"></div>
    <div id="cur-ring" aria-hidden="true"></div>

    <!-- Scripts share one global scope, so load them in this exact order -->
    <script src="js/01-core.js"></script>
    <script src="js/02-audio-engine.js"></script>
    <script src="js/03-services-player.js"></script>
    <script src="js/04-views.js"></script>
    <script src="js/05-shell-ui.js"></script>
    <script src="js/06-menus-router.js"></script>
    <script src="js/07-actions-init.js"></script>
